name: Build and publish Sileo repo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compression and APT validation tools
        run: sudo apt-get update && sudo apt-get install -y zstd apt-utils dpkg-dev
      - name: Run indexing tests
        run: python -m unittest discover -s tests -v
      - name: Get actual Pages address
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build repository
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_repo.py --base-url "${PAGES_URL:-https://example.invalid/preview/}"
      - name: Validate real DEBs and generated Packages using Debian tools
        run: python scripts/check_with_dpkg.py
      - name: Save Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Save build for post-deployment check
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: verification-manifest
          path: _site/manifest.json
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verification-manifest
          path: _site
      - name: Verify live indexes, web pages and every DEB
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_repo.py --base-url "$SITE_URL" --attempts 12
